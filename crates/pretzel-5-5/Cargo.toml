[package]
name = "pretzel-5-5"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pretzel-(5,5) signatures, 1908 bytes (research implementation)"
license.workspace = true
publish.workspace = true

[dependencies]
pretzel-5-5-transport-decision = { path = "samplers/transport-decision" }
pretzel-5-5-transport-locator = { path = "samplers/transport-locator" }
pretzel-5-5-proposal = { path = "samplers/proposal" }
sha3 = { workspace = true }
keccak = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true }

[features]
# Builds the known-answer replay program and its public test entropy. Never
# enable in applications.
conformance = []
# Off by default. Zeroes a fixed range of stack after key generation, after the
# import of a stored secret key and after signing; see the README.
stack-wipe = []

[[bin]]
name = "conformance_replay"
path = "src/bin/conformance_replay.rs"
required-features = ["conformance"]
