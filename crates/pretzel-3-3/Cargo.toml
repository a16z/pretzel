[package]
name = "pretzel-3-3"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pretzel-(3,3) signatures, 1160 bytes (research implementation)"
license.workspace = true
publish.workspace = true

[dependencies]
sha3 = { workspace = true }
keccak = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true }

[features]
# Public deterministic fixtures only; never enabled by default.
conformance = []
# Off by default. Zeroes a fixed range of stack after the import of a stored
# secret key and after signing; see the README.
stack-wipe = []

[[bin]]
name = "rank3_golden"
path = "conformance/known_answer.rs"
required-features = ["conformance"]
test = false
bench = false

[[bin]]
name = "rank3_key_bytes"
path = "conformance/key_bytes.rs"
required-features = ["conformance"]
test = false
bench = false
